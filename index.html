<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR CREATOR - DIGITAL BRAIN AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { background: #000; margin: 0; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        .header { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10; text-shadow: 0 0 10px #0f0; }
        
        /* 3D Modelin ölçüləri */
        model-viewer {
            width: 100%;
            height: 85vh;
            --poster-color: transparent;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        #ar-button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #0f0;
            margin-bottom: 10px;
        }

        .footer-text { font-size: 14px; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧠 RƏQƏMSAL ZƏKA PORTALI</h1>
        <p>Sistem İdentifikasiyası: QR CREATOR</p>
    </div>

    <model-viewer 
        id="brain-model"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
        ios-src=""
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate 
        rotation-speed="200%"
        shadow-intensity="2"
        exposure="1"
        environment-image="neutral">
        
        <div class="controls">
            <button id="ar-button">🚀 MODELİ MASADA CANLANDIR</button>
            <p class="footer-text">Vüqar müəllim, gələcəyə xoş gəldiniz!</p>
        </div>
    </model-viewer>

    <audio id="victory-voice" src="WhatsApp Audio 2026-05-12 at 6.34.59 PM.aac" preload="auto"></audio>

    <script>
        const modelViewer = document.querySelector('#brain-model');
        const voice = document.getElementById('victory-voice');

        // Model AR-da (masada) yerləşdiriləndə səsin çıxsın
        modelViewer.addEventListener('ar-status', (event) => {
            if(event.detail.status === 'object-placed') {
                voice.currentTime = 0;
                voice.play();
            }
        });

        // Ekrana toxunanda səsin dərhal başlaması üçün (ehtiyat variant)
        document.body.addEventListener('click', () => {
            if (voice.paused) {
                voice.play();
                voice.pause(); 
            }
        }, {once: true});
    </script>
</body>
</html>
