<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR CREATOR - FINAL MISSION</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; text-align: center; overflow: hidden; }
        .ui-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #bar-bg { width: 80%; height: 30px; border: 2px solid #0f0; margin: 20px; }
        #bar-fill { width: 0%; height: 100%; background: #0f0; }
        #main-btn { width: 100px; height: 100px; border-radius: 50%; border: none; background: #0f0; font-size: 40px; cursor: pointer; box-shadow: 0 0 20px #0f0; outline: none; }
        
        #final-ui { display: none; width: 100%; height: 100vh; position: absolute; top: 0; background: #000; flex-direction: column; align-items: center; justify-content: center; }
        model-viewer { width: 100%; height: 75vh; opacity: 0; transition: opacity 1s; }
    </style>
</head>
<body>

    <div class="ui-container" id="loading-screen">
        <h1 id="status-text">SİSTEM ENERJİSİ: 0%</h1>
        <div id="bar-bg"><div id="bar-fill"></div></div>
        <button id="main-btn" onmousedown="startLoading()" onmouseup="stopLoading()" ontouchstart="startLoading()" ontouchend="stopLoading()">🔋</button>
    </div>

    <div id="final-ui">
        <h1 id="final-msg" style="color:gold; margin-top:20px;">SİSTEM AKTİVLƏŞDİ!</h1>
        <model-viewer id="brain-model" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" auto-rotate camera-controls shadow-intensity="1"></model-viewer>
    </div>

    <audio id="v-audio" src="WhatsApp Audio 2026-05-12 at 6.34.59 PM.aac"></audio>
    <audio id="epic-bg" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3"></audio>

    <script>
        let progress = 0;
        let timer;
        const voice = document.getElementById('v-audio');
        const music = document.getElementById('epic-bg');
        const model = document.getElementById('brain-model');

        function startLoading() {
            voice.play(); voice.pause(); music.play(); music.pause(); // Səsləri oyat
            timer = setInterval(() => {
                if (progress < 100) {
                    progress++;
                    document.getElementById('bar-fill').style.width = progress + "%";
                    document.getElementById('status-text').innerText = "SİSTEM ENERJİSİ: " + progress + "%";
                } else {
                    clearInterval(timer);
                    executeFinalSequence();
                }
            }, 40);
        }

        function stopLoading() { clearInterval(timer); }

        function executeFinalSequence() {
            // A) Əvvəl Konfeti Partlayışı
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('final-ui').style.display = 'flex';
            
            confetti({ particleCount: 250, spread: 100, origin: { y: 0.6 } });

            // B) 2 saniyə sonra 3D Model görünsün (Konfetilər təmizlənəndə)
            setTimeout(() => {
                model.style.opacity = "1";
                music.volume = 0.2; music.play();
                voice.play();
            }, 2000);

            // C) Səs bitəndə sayt bağlansın (və ya başa dönsün)
            voice.onended = () => {
                document.body.innerHTML = "<div class='ui-container'><h1>SİSTEM BAĞLANDI.</h1><p>Missiya Tamamlandı.</p></div>";
                setTimeout(() => { window.close(); }, 2000); // Brauzer icazə versə pəncərəni bağlayır
            };
        }
    </script>
</body>
</html>
