<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR CREATOR - MISSION COMPLETE</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow: hidden; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #bar-container { border: 2px solid #0f0; width: 80%; height: 35px; margin: 20px; position: relative; box-shadow: 0 0 15px #0f0; }
        #bar { background: #0f0; width: 0%; height: 100%; transition: 0.1s; box-shadow: 0 0 20px #0f0; }
        #btn { background: #0f0; color: #000; border: none; padding: 25px; font-size: 45px; cursor: pointer; border-radius: 50%; outline: none; -webkit-tap-highlight-color: transparent; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% {box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7);} 70% {box-shadow: 0 0 0 20px rgba(0, 255, 0, 0);} 100% {box-shadow: 0 0 0 0 rgba(0, 255, 0, 0);} }
        #final-screen { display: none; background: radial-gradient(circle, #1a1a1a, #000); width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 100; }
        .member-list { border: 2px solid gold; padding: 20px; background: rgba(255, 215, 0, 0.1); border-radius: 15px; margin-top: 15px; box-shadow: 0 0 20px gold; }
        .member-name { color: #fff; font-size: 20px; margin: 8px 0; opacity: 0; animation: fadeIn 1s forwards; }
        @keyframes fadeIn { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }
    </style>
</head>
<body>

    <audio id="user-voice" src="WhatsApp Audio 2026-05-12 at 6.34.59 PM.aac" preload="auto"></audio>
    
    <audio id="epic-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" preload="auto"></audio>

    <div class="container" id="game-ui">
        <h1 style="letter-spacing: 3px;">SİSTEM ENERJİSİ: <span id="percent">0%</span></h1>
        <div id="bar-container"><div id="bar"></div></div>
        <p>Baza yüklənir... Düyməni basılı saxlayın!</p>
        <button id="btn" onmousedown="startLoading()" onmouseup="stopLoading()" ontouchstart="startLoading()" ontouchend="stopLoading()">🔋</button>
    </div>

    <div id="final-screen">
        <div class="container">
            <h1 style="color: gold; font-size: 35px; text-shadow: 0 0 15px gold;">🏆 MISSİYA TAMAMLANDI!</h1>
            <div class="member-list">
                <h2 style="color: gold; margin-bottom: 15px;">GROUP: QR CREATOR</h2>
                <div class="member-name" style="animation-delay: 0.5s;">⭐ Arzu</div>
                <div class="member-name" style="animation-delay: 1s;">⭐ Aynur</div>
                <div class="member-name" style="animation-delay: 1.5s;">⭐ Gülxanım</div>
                <div class="member-name" style="animation-delay: 2s;">⭐ Elmira</div>
                <div class="member-name" style="animation-delay: 2.5s;">⭐ Bəhruzə</div>
                <div class="member-name" style="animation-delay: 3s;">⭐ Nurcan</div>
            </div>
            <p style="color: #0f0; margin-top: 30px; font-weight: bold; font-size: 18px;">Vüqar müəllim, təqdimat uğurla başa çatdı!</p>
        </div>
    </div>

    <script>
        let power = 0;
        let interval;
        const voice = document.getElementById('user-voice');
        const music = document.getElementById('epic-music');

        function startLoading() {
            // Səsləri brauzerdə "oyadırıq"
            voice.play(); voice.pause();
            music.play(); music.pause();
            
            interval = setInterval(() => {
                if (power < 100) {
                    power += 1;
                    document.getElementById('bar').width = power + "%"; // Vizual bar üçün
                    document.getElementById('bar').style.width = power + "%";
                    document.getElementById('percent').innerText = power + "%";
                } else {
                    clearInterval(interval);
                    showFinal();
                }
            }, 50);
        }

        function stopLoading() { clearInterval(interval); }

        function showFinal() {
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('final-screen').style.display = 'flex';
            
            // Epik musiqi alçaq səslə başlayır
            music.volume = 0.4;
            music.currentTime = 0;
            music.play();

            // Sənin səsin tam səslə başlayır
            voice.volume = 1.0;
            voice.currentTime = 0;
            voice.play();

            // Konfeti yağışı
            var end = Date.now() + (5 * 1000);
            (function frame() {
                confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#00ff00', '#ffd700'] });
                confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#00ff00', '#ffd700'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }
    </script>
</body>
</html>
